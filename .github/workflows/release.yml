name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "发布标签（如 v1.2.3）；从分支手动触发时必须填写"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 前端产物 web/dist 是 go:embed 的内容来源（assets.go），必须先于任何 go 构建/测试完成
      - name: Resolve release tag
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v ]]; then
            echo "无效发布标签: '$RELEASE_TAG'（需以 v 开头；workflow_dispatch 请在 tag 输入框填写）" >&2
            exit 1
          fi
          echo "value=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          # 按 go.sum 缓存模块：CI 每次冷启动要下载约 25 个依赖（pion/x-sys 等）
          cache: true

      - name: Run tests
        run: go test ./... -timeout 300s

      - name: Build all platforms
        run: make build-all VERSION=${{ steps.tag.outputs.value }}

      # ---- Android APK（与桌面平台统一进 release）----
      # ubuntu-latest 自带 Android SDK；adb 资产由脚本从 Termux 仓库拉取
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch android adb assets
        run: python3 scripts/fetch-adb-android.py aarch64

      - name: Cross compile Go server (android/arm64)
        run: make android-go VERSION=${{ steps.tag.outputs.value }}

      - name: Build Android APK
        working-directory: android
        env:
          APP_VERSION: ${{ steps.tag.outputs.value }}
        run: ./gradlew assembleRelease --console=plain --no-daemon -PappVersion="${APP_VERSION#v}"

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk bin/adbreeze-android-${{ steps.tag.outputs.value }}.apk

      - name: Checksums
        run: |
          cd bin
          sha256sum adbreeze-* > checksums.txt
          cat checksums.txt

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          generate_release_notes: true
          files: |
            bin/adbreeze-*
            bin/checksums.txt

  docker:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v ]]; then
            echo "无效发布标签: '$RELEASE_TAG'" >&2
            exit 1
          fi
          echo "value=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      # GHCR 镜像名必须全小写，而 owner/repo 可能含大写
      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.value }}
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # 双架构：同一 tag 下发布 amd64 + arm64（OCI index），拉取时按主机架构自动选择
          platforms: linux/amd64,linux/arm64
          # 关闭 SLSA 证明，index 里只保留两个架构镜像，不出现 unknown/unknown 条目
          provenance: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
